[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
  "db: touches the Neon test branch",
  "llm: calls a real LLM (skipped in CI unless RUN_LLM_TESTS=1 is set)",
  "network: hits an external API (Buffer/Resend/Tavily)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
asyncio_mode = "auto"
